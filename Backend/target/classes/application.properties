# ==========================================
# Application Configuration
# ==========================================
spring.application.name=PredicTrack
server.port=8080

# ==========================================
# MySQL Database Configuration
# ==========================================
# createDatabaseIfNotExist=true automatically creates the 'predictrack' database if it does not exist yet
spring.datasource.url=jdbc:mysql://localhost:3306/predictrack?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=Sw@070607
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / Hibernate Configuration
# ==========================================
# 'update' automatically creates or updates database tables based on our @Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================================
# PredicTrack Custom Configuration
# ==========================================
# Keep ML residual correction disabled for the initial prototype
predictrack.ml.enabled=false
